<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
    }

    #ad {
      width: 300px;
      height: 250px;
      background: #1d1c1c;
      position: relative;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #fff48d;
    }

    .headline,
    .subline,
    .cta {
      position: absolute;
      left: 20px;
    }

    .headline {
      top: 40px;
      font-size: 28px;
      font-weight: bold;
    }

    .subline {
      top: 100px;
      font-size: 16px;
      opacity: 0;
    }

    .cta {
      bottom: 30px;
      background: #fff48d;
      color: #1d1c1c;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      opacity: 0;
    }
  </style>
</head>

<body>
  <div id="ad">
    <div class="headline">Hello World</div>
    <div class="subline">This is an example banner</div>
    <div class="cta">Learn more</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline();

    tl.from('.headline', { x: -50, opacity: 0, duration: 0.6 })
      .addLabel('gifStep_1')
      .to('.subline', { opacity: 1, duration: 0.5 }, '>3')
      .addLabel('gifStep_2')
      .to('.cta', { opacity: 1, y: -10, duration: 0.5 }, '>3')
      .addLabel('gifStep_3');
  </script>
</body>

</html>
